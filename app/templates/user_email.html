<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Thank you for reaching out!</h2>
  <p>Dear {{ contact.name }},</p>
  <p>This is a confirmation that we have received your message:</p>
  <p style="background: #f5f5f5; padding: 12px; border-radius: 4px;">{{ contact.comment }}</p>
  <p>We will review it and get back to you as soon as possible.</p>
  <hr>
  <p style="color: #666; font-size: 12px;">This is an automated confirmation. Please do not reply directly.</p>
</body>
</html>
