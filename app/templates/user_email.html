<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;padding:40px 20px;">
<tr><td align="center">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
    <tr><td style="background:linear-gradient(135deg,#667eea,#764ba2);padding:32px 40px;text-align:center;">
      <h1 style="color:#fff;font-size:22px;font-weight:600;margin:0;">Спасибо за обращение!</h1>
    </td></tr>
    <tr><td style="padding:32px 40px;">
      <p style="color:#333;font-size:15px;line-height:1.6;margin:0 0 16px;">Здравствуйте, <strong>{{ contact.name }}</strong>!</p>
      <p style="color:#555;font-size:14px;line-height:1.6;margin:0 0 20px;">Мы получили ваше сообщение и свяжемся с вами в ближайшее время.</p>
      <div style="background:#f8f9fc;border-radius:10px;padding:16px 20px;margin:0 0 20px;border-left:3px solid #667eea;">
        <p style="color:#888;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 8px;">Текст сообщения</p>
        <p style="color:#333;font-size:14px;line-height:1.6;margin:0;white-space:pre-wrap;">{{ contact.comment }}</p>
      </div>
      <p style="color:#999;font-size:12px;line-height:1.5;margin:0;">Это автоматическое подтверждение. Пожалуйста, не отвечайте на это письмо.</p>
    </td></tr>
    <tr><td style="background:#f8f9fc;padding:16px 40px;text-align:center;border-top:1px solid #eee;">
      <p style="color:#aaa;font-size:11px;margin:0;">Автоматическое уведомление &mdash; BackendDeveloperLanding</p>
    </td></tr>
  </table>
</td></tr></table>
</body>
</html>
